name: Build NUSA 2R firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "tools/build_rev2r.py"
      - ".github/workflows/build-rev2r.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build REV2R / NUSA 2R
        run: python3 tools/build_rev2r.py

      - name: Verify firmware
        run: |
          test "$(sha256sum NUSA_UV5RH_PRO_V2_REV2R_APRS_CTRL_FIX_BOARDV1.dat | awk '{print $1}')" = "03e8a3a47dd2f133112013261db83e4b201062cc9b519fc909427d949670276d"
          test "$(stat -c %s NUSA_UV5RH_PRO_V2_REV2R_APRS_CTRL_FIX_BOARDV1.dat)" = "401488"

      - name: Commit firmware binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NUSA_UV5RH_PRO_V2_REV2R_APRS_CTRL_FIX_BOARDV1.dat
          if git diff --cached --quiet; then
            echo "REV2R firmware already current."
          else
            git commit -m "Add NUSA 2R firmware binary"
            git push
          fi
